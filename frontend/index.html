<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediOP" />
    <meta name="application-name" content="MediOP" />
    <meta name="msapplication-TileColor" content="#0b1120" />
    <meta name="description" content="MediOP - National Hospital OP Booking & Healthcare Directory Portal across all 29 States of India" />

    <title>MediOP - National Hospital OP Booking & Doctor Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('MediOP ServiceWorker registered with scope:', reg.scope))
            .catch((err) => console.log('ServiceWorker registration error:', err));
        });
      }
    </script>
  </body>
</html>
