<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background Rounded Square -->
  <rect width="512" height="512" rx="115" fill="#0b1120"/>
  <rect x="16" y="16" width="480" height="480" rx="99" fill="url(#medGrad)" opacity="0.15"/>
  <rect x="24" y="24" width="464" height="464" rx="91" fill="#0f172a" stroke="url(#medGrad)" stroke-width="8"/>
  
  <!-- Outer glowing emblem circle -->
  <circle cx="256" cy="256" r="160" fill="url(#medGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="#0f172a"/>
  
  <!-- Medical Cross Graphic -->
  <g fill="url(#medGrad)">
    <rect x="232" y="148" width="48" height="216" rx="14"/>
    <rect x="148" y="232" width="216" height="48" rx="14"/>
  </g>

  <!-- Dynamic ECG / Heartbeat line overlay -->
  <path d="M 120 256 L 190 256 L 220 180 L 256 320 L 290 210 L 320 256 L 392 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="320" r="10" fill="#38bdf8"/>
</svg>
